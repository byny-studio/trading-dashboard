name: 신호 알림 (Discord)

on:
  # ⭐ 정시 트리거: 외부 스케줄러(cron-job.org)가 아래 event_type으로 호출.
  repository_dispatch:
    types: [market-close]
  # schedule은 백업(지연되더라도 발송 보장). cron-job.org 안정화 확인 후 제거 예정.
  schedule:
    # 한국시간 월~금 16:33 (장 마감 15:30 후 종가 확정) = 같은날 07:33 UTC
    - cron: "33 7 * * 1-5"
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install finance-datareader pandas numpy requests beautifulsoup4
      - name: 신호 점검 및 알림
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: python check_signals.py
