name: 신호 알림 (Discord)

on:
  schedule:
    # 한국시간 월~금 16:33 (장 마감 15:30 후 종가 확정) = 같은날 07:33 UTC
    # 정각/반각(:00,:30)은 GitHub 부하로 누락 잦음 → 비혼잡 분(:33) 사용
    # 마감 후 종가 신호 → 저녁 검토 → 익일 시초가 매수(백테스트 D종가→D+1시가 가정과 일치)
    - cron: "33 7 * * 1-5"
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install finance-datareader pandas numpy requests beautifulsoup4
      - name: 신호 점검 및 알림
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: python check_signals.py
