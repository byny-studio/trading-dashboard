name: 개장 전 브리핑 (Discord · 간밤 미국)

on:
  # ⭐ 정시 트리거: 외부 스케줄러(cron-job.org)가 아래 event_type으로 호출.
  #    GitHub schedule은 2~9시간 지연 상시라 개장 전 도착 불가 → 외부 스케줄러로 이전.
  repository_dispatch:
    types: [morning-brief]
  # schedule은 백업(지연되더라도 발송 보장). cron-job.org 안정화 확인 후 제거 예정.
  schedule:
    # 한국시간 월~금 08:13 (= 전날 23:13 UTC, KST 월~금 = UTC 일~목)
    - cron: "13 23 * * 0-4"
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install finance-datareader pandas numpy requests beautifulsoup4
      - name: 개장 전 브리핑 발송
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check_signals.py --morning
