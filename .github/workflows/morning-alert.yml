name: 개장 전 브리핑 (Discord · 간밤 미국)

on:
  schedule:
    # 한국시간 월~금 08:13 (미국장 마감 05~06시 후 · 국내 개장 09시 전)
    # = 전날 23:13 UTC. KST 월~금 아침 = UTC 일~목. 비혼잡 분(:13) 사용.
    # 간밤 미국 → 오늘 시초가 편향 + 테마 연관 (정보 참고용, 매매 개입 X)
    - cron: "13 23 * * 0-4"
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install finance-datareader pandas numpy requests beautifulsoup4
      - name: 개장 전 브리핑 발송
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check_signals.py --morning
